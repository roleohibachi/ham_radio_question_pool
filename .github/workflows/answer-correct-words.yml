name: Generate correct-only answer words

on:
  workflow_dispatch:
  push:
    paths:
      - 'extra-*/extra-*.json'
      - 'general-*/general-*.json'
      - 'technician-*/technician-*.json'
      - 'programs/exclusive_answer_words.py'
      - '.github/workflows/answer-correct-words.yml'

permissions:
  contents: read

jobs:
  generate:
    if: github.ref == format('refs/heads/{0}', github.event.repository.default_branch)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.event.repository.default_branch }}
      - uses: actions/setup-python@v5
        with:
          python-version: '3.x'
      - name: Generate lists
        run: python3 programs/exclusive_answer_words.py correct
      - name: Upload word lists
        uses: actions/upload-artifact@v4
        with:
          name: correct-only-answer-words
          path: word-lists/*-correct-only.txt
          if-no-files-found: error
